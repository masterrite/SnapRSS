# Builds the Windows installer, signs the update, and publishes a GitHub
# release with the latest.json the app's update check reads.
#
# To release: bump "version" in crates/app/tauri.conf.json and Cargo.toml
# (workspace), commit, then tag and push:  git tag v1.0.1 && git push --tags
#
# Needs one repository secret, TAURI_SIGNING_PRIVATE_KEY: the contents of
# snaprss-updater.key. Installed copies only accept updates signed with it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: crates/app
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: SnapRSS ${{ github.ref_name }}
          releaseBody: See the commit log for what changed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
