# Builds the Windows installer, signs the update, and publishes a GitHub
# release with the latest.json the app's update check reads.
#
# To release: bump "version" in crates/app/tauri.conf.json and Cargo.toml
# (workspace), commit, then tag and push:  git tag v1.0.1 && git push --tags
#
# Needs one repository secret, TAURI_SIGNING_PRIVATE_KEY: the contents of
# snaprss-updater.key. Installed copies only accept updates signed with it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # A cache made by one tag's run cannot be restored by another tag's
      # (GitHub scopes caches to the ref), so each release still compiles the
      # app from scratch. The cache does help when a release run is re-run.
      - uses: Swatinem/rust-cache@v2

      # No step installs the Tauri CLI. With no package.json in crates/app,
      # tauri-action installs @tauri-apps/cli from npm, which ships a
      # prebuilt binary and takes seconds. `cargo install tauri-cli` compiled
      # it from source on every release: Cargo.lock pins the app's
      # dependencies, not the CLI's, and the CLI was never cached.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: crates/app
          tagName: ${{ github.ref_name }}
          releaseName: SnapRSS ${{ github.ref_name }}
          releaseBody: See the commit log for what changed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
