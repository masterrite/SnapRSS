[package]
name = "snaprss-core"
description = "Storage, import and feed logic for SnapRSS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
quick-xml = "0.37"
regex = "1"
url = "2"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
